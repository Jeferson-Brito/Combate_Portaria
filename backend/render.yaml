services:
  - type: web
    name: combate-portaria-backend
    env: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    disk:
      name: whatsapp-sessions
      mountPath: /var/data/whatsapp_sessions
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Configurado no Dashboard do Render apontando para o Supabase
      - key: DIRECT_URL
        sync: false # Configurado no Dashboard do Render para Prisma migrations
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: WHATSAPP_SESSION_PATH
        value: /var/data/whatsapp_sessions
